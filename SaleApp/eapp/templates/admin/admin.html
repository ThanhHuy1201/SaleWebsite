{% extends 'admin/master.html' %}

{% block body %}

{% if current_user.is_authenticated %}
<div class="row">
  <div class="col-2">
    <img src="{{ current_user.avatar }}" class="img-fluid rounded" />
  </div>
  <div class="col-10">
    <h4 class="text-success">Chao {{ current_user.username }}</h4>
  </div>
</div>

{% else %}
<h1 class="text-center text-success">Dang nhap Quan Tri</h1>
<form action="{{ url_for('admin.index') }}" method="POST">
  <div class="form-group">
    <label for="username">Ten dang nhap</label>
    <input type="text" class="form-control" placeholder="Ten dang nhap" id="username" name="username"/>
  </div>
  <div class="form-group">
    <label for="pwd">Mat khau</label>
    <input type="password" class="form-control" placeholder="Mat khau" id="pwd" name="password"/>
  </div>

  <button type="submit" class="btn btn-primary">Dang nhap</button>
</form>
{% endif %}

{% endblock %}
